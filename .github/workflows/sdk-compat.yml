name: SDK compatibility

on:
  workflow_call:
  workflow_dispatch:
  push:
    tags: ["v*"]
  repository_dispatch:
    types: [sdk-release]
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

env:
  SVEDA_BASE_URL: http://127.0.0.1:18787
  SVEDA_HOST_KEY: sveda-compat-host-key
  SVEDA_EMBED_HOST_API_KEY: sveda-compat-host-key

jobs:
  matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: php
            repo: neresson/sveda-php-sdk
          - sdk: python
            repo: neresson/sveda-python-sdk
          - sdk: node
            repo: neresson/sveda-node-sdk
          - sdk: go
            repo: neresson/sveda-go-sdk
          - sdk: java
            repo: neresson/sveda-java-sdk
          - sdk: dotnet
            repo: neresson/sveda-dotnet-sdk
          - sdk: ruby
            repo: neresson/sveda-ruby-sdk
          - sdk: laravel
            repo: neresson/sveda-laravel-sdk
    steps:
      - name: Checkout sveda
        uses: actions/checkout@v4
        with:
          path: sveda

      - name: Checkout SDK
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: main
          path: sdk

      - name: Checkout PHP SDK for Laravel
        if: matrix.sdk == 'laravel'
        uses: actions/checkout@v4
        with:
          repository: neresson/sveda-php-sdk
          ref: main
          path: sveda-php-sdk

      - uses: shivammathur/setup-php@v2
        if: matrix.sdk == 'php' || matrix.sdk == 'laravel'
        with:
          php-version: "8.4"
          tools: composer
          coverage: none

      - uses: actions/setup-python@v5
        if: matrix.sdk == 'python'
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        if: matrix.sdk == 'node'
        with:
          node-version: "22"

      - uses: actions/setup-go@v5
        if: matrix.sdk == 'go'
        with:
          go-version: "1.22"

      - uses: actions/setup-java@v4
        if: matrix.sdk == 'java'
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: actions/setup-dotnet@v4
        if: matrix.sdk == 'dotnet'
        with:
          dotnet-version: "8.0.x"

      - uses: ruby/setup-ruby@v1
        if: matrix.sdk == 'ruby'
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Build and start sveda-server
        working-directory: sveda
        run: |
          cargo build -p sveda-server
          bash scripts/sdk-compat/serve.sh > /tmp/sveda-compat.log 2>&1 &
          bash scripts/sdk-compat/wait-ready.sh

      - name: Run SDK contract and live smoke tests
        env:
          SDK_DIR: ${{ github.workspace }}/sdk
        run: bash sveda/scripts/sdk-compat/run-sdk.sh "${{ matrix.sdk }}"

      - name: Record matrix row
        if: always()
        run: |
          mkdir -p compat-results
          echo "${{ matrix.sdk }}=${{ job.status }}" >> compat-results/matrix.env

      - name: Upload matrix row
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-${{ matrix.sdk }}
          path: compat-results/matrix.env

  android-gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          SDK_COMPAT_CHECKOUT_TOKEN: ${{ secrets.SDK_COMPAT_CHECKOUT_TOKEN }}
        run: |
          if [ -n "$SDK_COMPAT_CHECKOUT_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  android:
    needs: android-gate
    runs-on: ubuntu-latest
    if: needs.android-gate.outputs.enabled == 'true'
    steps:
      - name: Checkout sveda
        uses: actions/checkout@v4
        with:
          path: sveda

      - name: Checkout Android SDK
        uses: actions/checkout@v4
        with:
          repository: neresson/sveda-android
          ref: main
          path: sdk
          token: ${{ secrets.SDK_COMPAT_CHECKOUT_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build and start sveda-server
        working-directory: sveda
        run: |
          cargo build -p sveda-server
          bash scripts/sdk-compat/serve.sh > /tmp/sveda-compat.log 2>&1 &
          bash scripts/sdk-compat/wait-ready.sh

      - name: Run Android core contract tests
        env:
          SDK_DIR: ${{ github.workspace }}/sdk
        run: bash sveda/scripts/sdk-compat/run-sdk.sh android

      - name: Record matrix row
        if: always()
        run: |
          mkdir -p compat-results
          echo "android=${{ job.status }}" >> compat-results/matrix.env

      - name: Upload matrix row
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-android
          path: compat-results/matrix.env

  report:
    runs-on: ubuntu-latest
    needs: [matrix, android]
    if: always()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: sveda

      - uses: actions/download-artifact@v4
        with:
          pattern: compat-*
          path: compat-results
          merge-multiple: true

      - name: Write COMPATIBILITY.md
        run: bash scripts/sdk-compat/write-compatibility-report.sh compat-results
        working-directory: sveda

      - name: Fail when any SDK failed
        run: |
          if grep -rq '=failure' compat-results 2>/dev/null; then
            echo "One or more SDK compatibility jobs failed"
            find compat-results -name matrix.env -print -exec cat {} \;
            exit 1
          fi

      - name: Commit compatibility report
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        working-directory: sveda
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add COMPATIBILITY.md || true
          git diff --cached --quiet && exit 0
          git commit -m "chore: update SDK compatibility matrix"
          git push
