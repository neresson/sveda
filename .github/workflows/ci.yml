name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm typecheck
      - name: Build embed stylesheet
        working-directory: apps/runtime
        run: |
          npm install -g npm@latest
          npm ci
          npx vite build --config vite.embed.config.js
      - run: pnpm test

  rust-fmt-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets

  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sveda
          POSTGRES_PASSWORD: sveda
          POSTGRES_DB: sveda
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sveda -d sveda"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SVEDA_TEST_DATABASE_URL: postgres://sveda:sveda@localhost:5432/sveda
      SVEDA_TEST_REDIS_URL: redis://localhost:6379
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          if [ -n "${DEEPSEEK_API_KEY:-}" ]; then
            export SVEDA_REQUIRE_LIVE_LLM=1
          fi
          cargo test --workspace

  rust-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/sveda-server
      - run: >
          helm template sveda charts/sveda-server
          --set secrets.appKey=ci
          --set secrets.adminApiKey=ci-admin-key-16
          --set postgresql.enabled=true
          --set redis.enabled=true
          >/dev/null

  e2e-persistent:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sveda
          POSTGRES_PASSWORD: sveda
          POSTGRES_DB: sveda
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sveda -d sveda"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SVEDA_E2E_PERSISTENT: "1"
      SVEDA_DATABASE_URL: postgres://sveda:sveda@localhost:5432/sveda
      SVEDA_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install
      - name: Build admin UI
        working-directory: apps/runtime
        run: |
          npm install -g npm@latest
          npm ci
          npm run build
      - run: cargo build -p sveda-server
      - run: pnpm --dir e2e exec playwright install --with-deps chromium
      - run: pnpm --dir e2e run test:e2e:persistent
        env:
          CI: true
          SVEDA_ADMIN_API_KEY: sveda-e2e-admin-key

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install
      - name: Build admin UI
        working-directory: apps/runtime
        run: |
          npm install -g npm@latest
          npm ci
          npm run build
      - run: cargo build -p sveda-server
      - run: pnpm --dir e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: true
          SVEDA_ADMIN_API_KEY: sveda-e2e-admin-key
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

  notify:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [js, rust-fmt-clippy, rust, rust-coverage, helm, e2e, e2e-persistent]
    if: failure() && github.event_name == 'push'
    steps:
      - name: Telegram (optional)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not set"
            exit 0
          fi
          text="❌ Sveda CI failed on ${GITHUB_REF_NAME}: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}"

      - name: Slack (optional)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "Slack webhook is not set"
            exit 0
          fi
          payload=$(jq -n \
            --arg text "❌ Sveda CI failed on ${GITHUB_REF_NAME}: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{text: $text}')
          curl -fsS -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
