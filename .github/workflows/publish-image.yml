name: Publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/sveda-server

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            digest_suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            digest_suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.REGISTRY_IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.digest_suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.digest_suffix }}
      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.digest_suffix }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Push manifest to GHCR
        working-directory: ${{ runner.temp }}/digests
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

  rollout:
    runs-on: ubuntu-latest
    needs: merge
    if: github.ref == 'refs/heads/main'
    steps:
      - id: cfg
        env:
          HOST: ${{ secrets.RUNTIME_SSH_HOST }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          ORIGIN: ${{ vars.RUNTIME_EMBED_ORIGIN }}
        run: |
          echo "ssh=$([ -n "$HOST" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "purge=$([ -n "$CF_TOKEN" ] && [ -n "$CF_ZONE" ] && [ -n "$ORIGIN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Pull and restart runtime
        if: steps.cfg.outputs.ssh == 'true'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.RUNTIME_SSH_HOST }}
          username: ${{ secrets.RUNTIME_SSH_USER }}
          key: ${{ secrets.RUNTIME_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.RUNTIME_COMPOSE_DIR }}"
            docker compose pull sveda-server
            docker compose up -d sveda-server
      - name: Purge embed CDN cache
        if: steps.cfg.outputs.purge == 'true'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          ORIGIN: ${{ vars.RUNTIME_EMBED_ORIGIN }}
        run: |
          origin="${ORIGIN%/}"
          files=$(jq -nc --arg o "$origin" '{files:[
            "\($o)/build/sveda/sveda-chat.js",
            "\($o)/build/sveda/sveda-chat.css",
            "\($o)/build/sveda/widget.js",
            "\($o)/build/sveda/embed.js",
            "\($o)/build/sveda/embed.css"
          ]}')
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/purge_cache" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$files"
