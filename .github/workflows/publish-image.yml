name: Publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      rollout_git_sha:
        description: Git commit SHA to deploy (sha-* image tag + revision check). Defaults to this workflow run's commit.
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/sveda-server

jobs:
  sdk-compat:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/sdk-compat.yml

  build:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.rollout_git_sha == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            digest_suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            digest_suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.REGISTRY_IMAGE }}
          build-args: |
            SVEDA_REVISION=${{ github.event.inputs.rollout_git_sha || github.sha }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.digest_suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.digest_suffix }}
      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.digest_suffix }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.rollout_git_sha == ''
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Push manifest to GHCR
        working-directory: ${{ runner.temp }}/digests
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

  rollout:
    runs-on: ubuntu-latest
    needs: [merge, sdk-compat]
    if: |
      always() &&
      (needs.merge.result == 'success' || needs.merge.result == 'skipped') &&
      (needs.sdk-compat.result == 'success' || needs.sdk-compat.result == 'skipped') &&
      (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    env:
      ROLLOUT_GIT_SHA: ${{ github.event.inputs.rollout_git_sha || github.sha }}
    steps:
      - id: cfg
        env:
          HOST: ${{ secrets.RUNTIME_SSH_HOST }}
          ROLLOUT_GIT_SHA: ${{ env.ROLLOUT_GIT_SHA }}
        run: |
          echo "ssh=$([ -n "$HOST" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-${ROLLOUT_GIT_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - name: Pull and restart runtime
        if: steps.cfg.outputs.ssh == 'true'
        uses: appleboy/ssh-action@v1.2.2
        env:
          ROLLOUT_GIT_SHA: ${{ env.ROLLOUT_GIT_SHA }}
          IMAGE_TAG: ${{ steps.cfg.outputs.image_tag }}
          COMPOSE_DIR: ${{ secrets.RUNTIME_COMPOSE_DIR }}
        with:
          host: ${{ secrets.RUNTIME_SSH_HOST }}
          username: ${{ secrets.RUNTIME_SSH_USER }}
          key: ${{ secrets.RUNTIME_SSH_KEY }}
          script_stop: true
          envs: ROLLOUT_GIT_SHA,IMAGE_TAG,COMPOSE_DIR
          script: |
            set -euo pipefail
            cd "$COMPOSE_DIR"
            if grep -q '^SVEDA_IMAGE_TAG=' .env 2>/dev/null; then
              sed -i "s/^SVEDA_IMAGE_TAG=.*/SVEDA_IMAGE_TAG=${IMAGE_TAG}/" .env
            else
              echo "SVEDA_IMAGE_TAG=${IMAGE_TAG}" >> .env
            fi
            docker compose pull sveda-server
            docker compose up -d sveda-server
            for attempt in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8787/sveda/ready >/dev/null; then
                break
              fi
              sleep 2
            done
            curl -fsS http://127.0.0.1:8787/sveda/ready >/dev/null
            health="$(curl -fsS http://127.0.0.1:8787/sveda/health)"
            revision="$(printf '%s' "$health" | sed -n 's/.*"revision":"\([^"]*\)".*/\1/p' | head -n1)"
            if [ "$revision" != "$ROLLOUT_GIT_SHA" ]; then
              echo "Expected revision ${ROLLOUT_GIT_SHA}, got ${revision:-<empty>}"
              exit 1
            fi
