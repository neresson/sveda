name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      # Do not set registry-url: setup-node would write always-auth and a dummy
      # NODE_AUTH_TOKEN, which makes npm skip OIDC trusted publishing and PUT 404.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sveda-ai/protocol --filter @sveda-ai/core --filter @sveda-ai/chat --filter @sveda-ai/vue --filter @sveda-ai/react --filter @sveda-ai/svelte --filter @sveda-ai/solid run build
      - name: Build element
        working-directory: apps/runtime
        run: |
          npm ci
          npx vite build --config vite.embed.config.js
          pnpm --dir ../../packages/element run build
      - name: Publish unpublished packages
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN NPM_TOKEN || true
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "${NPM_CONFIG_USERCONFIG}" ]; then
            sed -i '/_authToken/d; /always-auth/d' "${NPM_CONFIG_USERCONFIG}"
          fi
          npm --version
          failed=0
          for dir in protocol core chat vue react svelte solid element; do
            name="$(node -p "require('./packages/${dir}/package.json').name")"
            ver="$(node -p "require('./packages/${dir}/package.json').version")"
            if npm view "${name}@${ver}" version >/dev/null 2>&1; then
              echo "${name}@${ver} already on npm, skip"
              continue
            fi
            echo "Publishing ${name}@${ver}"
            if ! (cd "packages/${dir}" && pnpm publish --access public --no-git-checks); then
              echo "::error::Failed to publish ${name}@${ver}"
              failed=1
            fi
          done
          exit "${failed}"
