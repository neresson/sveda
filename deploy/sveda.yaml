cors:
  allowed_origins:
    - http://localhost:5173
web:
  enabled: true
  # searxng_url: http://searxng:8080
compaction:
  enabled: true
  min_messages: 12
  keep_tail_messages: 6
security:
  embed_token_throttle_max: 30
  embed_token_throttle_window_secs: 60
  stream_throttle_max: 20
  stream_throttle_window_secs: 60
  occupancy_global: 32
  occupancy_per_visitor: 2
  # client_ip_header: CF-Connecting-IP
  # ip_throttle_max: 60
  # ip_throttle_window_secs: 60
