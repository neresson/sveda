# Self-hosted runtime settings. Secrets stay in the environment
# (DEEPSEEK_API_KEY, OPENAI_API_KEY, SVEDA_EMBED_HOST_API_KEY, SVEDA_ADMIN_API_KEY).
# Point SVEDA_CONFIG at this file, or place it next to the process as sveda.yaml.
# Reload with: kill -HUP <pid>
#
# Keys you omit stay at their env defaults. Keys you set replace those defaults.

system_prompt: |
  You are a helpful assistant embedded in the host application.
welcome_message: ""
max_steps: 8

