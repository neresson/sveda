# Optional overlay: pull ghcr.io/neresson/sveda-server:latest and recreate
# sveda-server when Publish image tags a new digest.
#
#   docker compose -f compose.yaml -f compose.watchtower.yaml up -d
#
# Do not enable this on a host that must stay on a pinned image.
services:
  sveda-server:
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 60 --cleanup
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
