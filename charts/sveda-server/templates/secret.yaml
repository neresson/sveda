{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sveda-server.fullname" . }}
  labels:
    {{- include "sveda-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  SVEDA_APP_KEY: {{ required "secrets.appKey is required" .Values.secrets.appKey | quote }}
  SVEDA_ADMIN_API_KEY: {{ required "secrets.adminApiKey is required" .Values.secrets.adminApiKey | quote }}
  SVEDA_EMBED_HOST_API_KEY: {{ .Values.secrets.hostApiKey | quote }}
  DEEPSEEK_API_KEY: {{ .Values.secrets.deepseekApiKey | quote }}
  {{- if and (not .Values.postgresql.enabled) .Values.databaseUrl }}
  SVEDA_DATABASE_URL: {{ .Values.databaseUrl | quote }}
  {{- else if .Values.postgresql.enabled }}
  SVEDA_DATABASE_URL: {{ printf "postgres://%s:%s@%s:5432/%s" .Values.postgresql.username .Values.postgresql.password (include "sveda-server.postgresHost" .) .Values.postgresql.database | quote }}
  {{- else }}
  {{- fail "Set databaseUrl or postgresql.enabled" }}
  {{- end }}
  {{- if and (not .Values.redis.enabled) .Values.redisUrl }}
  SVEDA_REDIS_URL: {{ .Values.redisUrl | quote }}
  {{- else if .Values.redis.enabled }}
  SVEDA_REDIS_URL: {{ printf "redis://%s:6379" (include "sveda-server.redisHost" .) | quote }}
  {{- else }}
  {{- fail "Set redisUrl or redis.enabled" }}
  {{- end }}
{{- end }}
